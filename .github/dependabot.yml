# Actions only; the Dockerfile base images aren't covered because public.ecr.aws answers Dependabot's shared runners
# with 429 (tools/pin-bases keeps those digests current instead) and the inline pip pins aren't visible to it.
# Dependabot only opens PRs; merging one means pulling it onto main like any other commit (tests green first).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "niwa: "
    groups:
      actions:
        patterns: ["*"]
